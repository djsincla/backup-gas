<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #202124;
        --muted: #5f6368;
        --primary: #1a73e8;
        --on-primary: #ffffff;
        --secondary: #e8eaed;
        --error: #c5221f;
        --link: #1a73e8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #202124;
          --fg: #e8eaed;
          --muted: #9aa0a6;
          --primary: #8ab4f8;
          --on-primary: #202124;
          --secondary: #3c4043;
          --error: #f28b82;
          --link: #8ab4f8;
        }
      }

      body { width: 320px; margin: 0; padding: 14px 16px; font: 13px Arial, sans-serif; background: var(--bg); color: var(--fg); }
      h1 { font-size: 15px; margin: 0 0 2px; }
      #project { color: var(--muted); margin-bottom: 10px; word-break: break-word; }
      ul { list-style: none; margin: 0 0 12px; padding: 0; max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px; }
      li { padding: 2px 0; }
      button { width: 100%; border: 0; border-radius: 4px; padding: 9px; font-size: 13px; cursor: pointer; margin-bottom: 6px; }
      #drive { background: var(--primary); color: var(--on-primary); }
      #download { background: var(--secondary); color: var(--fg); }
      button:disabled { opacity: .6; cursor: default; }
      #status { margin-top: 8px; }
      #status.error { color: var(--error); }
      .hint { color: var(--muted); font-size: 11px; margin-top: 6px; }
      a { color: var(--link); }
    </style>
  </head>
  <body>
    <h1>BackupGAS</h1>
    <div id="project"></div>
    <ul id="files"></ul>
    <div id="buttons" hidden>
      <button id="drive">Save to Google Drive</button>
      <button id="download">Download to this computer</button>
    </div>
    <div id="status"></div>
    <div class="hint" id="hint" hidden>You can close this popup; it keeps going.</div>
    <div class="hint"><a href="#" id="settings">Settings</a> &middot; <a href="#" id="changes">What's new</a> &middot; <span id="version"></span></div>
    <script src="popup.js"></script>
  </body>
</html>
