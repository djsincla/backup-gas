<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      body { width: 320px; margin: 0; padding: 14px 16px; font: 13px Arial, sans-serif; color: #202124; }
      h1 { font-size: 15px; margin: 0 0 2px; }
      #project { color: #5f6368; margin-bottom: 10px; word-break: break-word; }
      ul { list-style: none; margin: 0 0 12px; padding: 0; max-height: 200px; overflow-y: auto; font-family: monospace; font-size: 12px; }
      li { padding: 2px 0; }
      button { width: 100%; border: 0; border-radius: 4px; padding: 9px; font-size: 13px; cursor: pointer; margin-bottom: 6px; }
      #drive { background: #1a73e8; color: #fff; }
      #download { background: #e8eaed; color: #202124; }
      button:disabled { opacity: .6; cursor: default; }
      #status { margin-top: 8px; }
      #status.error { color: #c5221f; }
      .hint { color: #5f6368; font-size: 11px; margin-top: 6px; }
      a { color: #1a73e8; }
    </style>
  </head>
  <body>
    <h1>BackupGAS</h1>
    <div id="project"></div>
    <ul id="files"></ul>
    <div id="buttons" hidden>
      <button id="drive">Save to Google Drive</button>
      <button id="download">Download to this computer</button>
    </div>
    <div id="status"></div>
    <div class="hint" id="hint" hidden>You can close this popup; it keeps going.</div>
    <div class="hint"><a href="#" id="settings">Settings</a></div>
    <script src="popup.js"></script>
  </body>
</html>
